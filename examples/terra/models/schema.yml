version: 2

models:
  - name: trip_facts
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: pickup_zone
        tests: [not_null]
      - name: dropoff_zone
        tests: [not_null]
      - name: trip_distance
        tests:
          - not_null
          - expression_is_true:
              expression: ">= 0"
      - name: fare_amount
        tests:
          - not_null
          - expression_is_true:
              expression: ">= 0"
      - name: trip_minutes
        tests:
          - expression_is_true:
              expression: "> 0"
      - name: total_revenue
        tests:
          - expression_is_true:
              expression: ">= 0"
  - name: quarantined_trips
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: reason
        tests:
          - not_null
          - accepted_values:
              values: [invalid_duration, unknown_pickup_zone, unknown_dropoff_zone, negative_distance, negative_fare]
  - name: hourly_zone_metrics
    columns:
      - name: pickup_zone
        tests: [not_null]
      - name: pickup_hour
        tests: [not_null]
      - name: trip_count
        tests:
          - expression_is_true:
              expression: ">= 0"
      - name: total_revenue
        tests:
          - expression_is_true:
              expression: ">= 0"
  - name: daily_route_metrics
    columns:
      - name: service_date
        tests: [not_null]
      - name: pickup_zone
        tests: [not_null]
      - name: dropoff_zone
        tests: [not_null]
      - name: trip_count
        tests:
          - expression_is_true:
              expression: ">= 0"
      - name: avg_trip_minutes
        tests:
          - expression_is_true:
              expression: "> 0"
  - name: data_quality_summary
    columns:
      - name: reason
        tests:
          - not_null
          - accepted_values:
              values: [invalid_duration, unknown_pickup_zone, unknown_dropoff_zone, negative_distance, negative_fare]
      - name: row_count
        tests:
          - expression_is_true:
              expression: ">= 0"
